<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldnote settings (prototype)</title>
<style>
  :root { --bg: #16141c; --panel: #201d29; --line: #2f2b3b; --ink: #f0eef6; --soft: #9a95aa; --on: #7a6cff; --off: #3a3548; }
  .light { --bg: #f6f5fa; --panel: #ffffff; --line: #e6e3ef; --ink: #1c1a24; --soft: #6b6680; --on: #5b4ce6; --off: #cfcbdb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; padding: 22px 20px; transition: background 0.25s, color 0.25s; }
  body.big { font-size: 18px; }
  h1 { font-size: 1.75em; margin: 4px 0 18px; letter-spacing: -0.02em; }
  h2 { font-size: 0.8em; color: var(--soft); margin: 20px 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .group { background: var(--panel); border-radius: 18px; padding: 4px 16px; transition: background 0.25s; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--soft); font-size: 0.82em; }
  button.t { flex: none; width: 50px; height: 30px; border-radius: 30px; border: 0; background: var(--off); position: relative; cursor: pointer; transition: background 0.2s; }
  button.t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.2s; }
  button.t[aria-checked="true"] { background: var(--on); }
  button.t[aria-checked="true"]::after { left: 23px; }
  button.t:focus-visible { outline: 3px solid var(--on); outline-offset: 2px; }
  .note { margin-top: 18px; font-size: 0.85em; color: var(--soft); }
</style>
</head>
<body>
  <h1>Settings</h1>
  <h2>Appearance</h2>
  <div class="group">
    <div class="row"><span>Dark mode<small>Follows your system by default</small></span><button class="t" role="switch" aria-checked="true" aria-label="Dark mode" data-do="dark"></button></div>
    <div class="row"><span>Large text<small>Bigger notes and menus</small></span><button class="t" role="switch" aria-checked="false" aria-label="Large text" data-do="big"></button></div>
  </div>
  <h2>Notifications</h2>
  <div class="group">
    <div class="row"><span>Weekly summary<small>Sent Monday at 8 AM</small></span><button class="t" role="switch" aria-checked="true" aria-label="Weekly summary"></button></div>
    <div class="row"><span>Mentions<small>When someone tags you</small></span><button class="t" role="switch" aria-checked="true" aria-label="Mentions"></button></div>
  </div>
  <p class="note" id="note">Try the switches. Nothing is saved yet: reload and they go back.</p>
  <script>
    document.querySelectorAll('button.t').forEach(function (b) {
      b.addEventListener('click', function () {
        var on = b.getAttribute('aria-checked') !== 'true';
        b.setAttribute('aria-checked', String(on));
        if (b.dataset.do === 'dark') document.body.classList.toggle('light', !on);
        if (b.dataset.do === 'big') document.body.classList.toggle('big', on);
        document.getElementById('note').textContent = b.getAttribute('aria-label') + ' is ' + (on ? 'on' : 'off') + '. Not saved yet: reload and it goes back.';
      });
    });
  </script>
</body>
</html>
